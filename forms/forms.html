<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>payment form</title>
</head>
<body>
 
    <form action="">
           <h1 align="center">Payment form</h1>
           <p>Required fileds are followed by*</p>
    <h2 align ="center">Contact Information</h2>
    <p align="center">Name:* <input type="text" name="Name" required></p>
    <i></i>
        <fieldset>
            <legend align="">Select Gender</legend>
            <p>
        Male <input type="radio" name="gender" id="Male" required>   Female <input type="radio" name="gender" id="Female" required>
  </P>
    </fieldset>
    <p >Address: <textarea name="address" id="address" cols="108" row="8"></textarea></p>
    <p >Email: <input type="email" name="email" id="email"></p>
    <p >Pincode: <input type="number" name="pincode" id="pincode"></p>
    <h2>Payment Information</h2>
    <p>Card type:
        <select name="card_type" id="card_type">
        <option value="">--Select a Card Type</option>
        <option value="Visa">Visa</option>
        <option value="Rupey">Rupay</option>
        <option value="Master card">Master card</option>
        </select>
    </p>
    <P>
        Card no <input type="number" name="card no" id="card_number">
    </P>
    <p>
        Expiration Date: <input type="date" name="exp_date" id="exp_date" >
    </p>
    <p>CVV <input type="password" name="cvv" id="cvv"></p>
    <input type="submit" value="Pay now">

    
    </form>
    
</body>
</html>
